apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/networking/envoy-gateway/config

patches:
  # Tailnet IP, not the 10.0.1.2 externalIP below: the tau-ceti forward proxy has
  # to reach this cluster too. LAN clients still get 10.0.1.2 from local powerdns.
  - target:
      kind: Gateway
      name: envoy-ingress
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: envoy-ingress
        annotations:
          external-dns.alpha.kubernetes.io/target: 100.108.214.28 # svc:eridani-ingress
  - target:
      kind: EnvoyProxy
      name: envoy-ingress
    patch: |-
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: EnvoyProxy
      metadata:
        name: envoy-ingress
      spec:
        provider:
          kubernetes:
            envoyService:
              patch:
                type: StrategicMerge
                value:
                  spec:
                    externalIPs:
                      - 10.0.1.2
