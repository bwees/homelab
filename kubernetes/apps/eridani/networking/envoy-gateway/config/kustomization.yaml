apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/networking/envoy-gateway/config

patches:
  # home.bwees.dev is public DNS with a single answer, so it points at the LAN IP:
  # family devices reach it without NetBird, and the mesh still gets there via the
  # 10.0.1.0/24 network route this node serves. The overlay ingress name is only
  # used by tau-ceti's forward proxy, which resolves bwees.io out of bind9 - where
  # external-dns-bind overrides this target with the cluster's ingress label.
  - target:
      kind: Gateway
      name: envoy-ingress
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: envoy-ingress
        annotations:
          external-dns.alpha.kubernetes.io/target: 10.0.1.2
  - target:
      kind: EnvoyProxy
      name: envoy-ingress
    patch: |-
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: EnvoyProxy
      metadata:
        name: envoy-ingress
      spec:
        provider:
          kubernetes:
            envoyService:
              patch:
                type: StrategicMerge
                value:
                  spec:
                    externalIPs:
                      - 10.0.1.2
