apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mosquitto
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: '2.1.2-alpine'
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 1883
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *probes

    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "iot",
            "namespace": "networking",
            "interface": "iot0",
            "ips": ["${IOT_ADDRESS}/24"],
            "mac": "02:f3:00:6f:6d:cf"
          }]
      nodeSelector:
        lab.bwees/iot-vlan: 'true'
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        runAsNonRoot: true
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        # external-dns cannot see the pod's macvlan address, so it is handed the
        # same address the pod is given.
        annotations:
          external-dns.kubernetes.io/hostname: mqtt.bwees.dev
          external-dns.kubernetes.io/target: ${IOT_ADDRESS}
        ports:
          mqtt:
            port: 1883

    persistence:
      data:
        existingClaim: mosquitto-data
        globalMounts:
          - path: /mosquitto/data
      config:
        type: configMap
        name: mosquitto-config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
