apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/smarthome/mosquitto/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: multus-networks
      namespace: networking
    - name: miroir-config
      namespace: storage
  targetNamespace: smarthome
  postBuild:
    substitute:
      IOT_ADDRESS: 192.168.30.130
