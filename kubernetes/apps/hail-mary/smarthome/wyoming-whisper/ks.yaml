apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wyoming-whisper
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/smarthome/wyoming-whisper/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
  targetNamespace: smarthome
