apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: music-assistant
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/smarthome/music-assistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: volsync
      namespace: storage
    - name: onepassword
      namespace: secrets
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: music-assistant
      VOLSYNC_CLAIM: music-assistant-data
      VOLSYNC_UID: '0'
      VOLSYNC_GID: '0'
  targetNamespace: smarthome
