ui:
  default-sort-by: group

storage:
  type: sqlite
  path: /data/gatus.db

endpoints:
  - name: is-zack-a-dad
    group: misc
    url: 'https://iszacka.dad/api/status'
    interval: 5m
    conditions:
      - '[STATUS] == 200'
      - '[BODY].isZackADad == false'
    alerts:
      - type: discord
        failure-threshold: 1
        description: 'Zack is a dad'

  - name: dns
    group: misc
    # confirms external-dns is still publishing into the bwees.dev Cloudflare zone
    url: '1.1.1.1'
    dns:
      query-name: 'nas.bwees.dev'
      query-type: 'A'
    conditions:
      - '[BODY] == 192.168.50.4'
      - '[DNS_RCODE] == NOERROR'
    alerts:
      - type: discord
