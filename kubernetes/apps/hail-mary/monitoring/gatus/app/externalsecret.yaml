apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: gatus-secret
    template:
      data:
        GATUS_DISCORD_WEBHOOK: '{{ .DISCORD_WEBHOOK_URL }}'
  dataFrom:
    - find:
        path: /gatus
