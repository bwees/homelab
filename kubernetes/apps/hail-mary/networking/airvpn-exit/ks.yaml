apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: airvpn-exit
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/networking/airvpn-exit/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: onepassword
      namespace: secrets
    # the SetupKey CRD and the account groups it references
    - name: netbird-peers
      namespace: networking
  targetNamespace: networking
