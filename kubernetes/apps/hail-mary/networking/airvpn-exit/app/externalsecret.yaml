apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airvpn
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: airvpn
    template:
      data:
        # From AirVPN's config generator (Linux/WireGuard), plus the port reserved
        # in the client area: the forwarded port has to match the port the NetBird
        # client listens on, or peers can only reach it through a relay.
        WIREGUARD_PRIVATE_KEY: '{{ .private_key }}'
        WIREGUARD_PRESHARED_KEY: '{{ .preshared_key }}'
        WIREGUARD_ADDRESSES: '{{ .addresses }}'
        FIREWALL_VPN_INPUT_PORTS: '{{ .forwarded_port }}'
        NB_WIREGUARD_PORT: '{{ .forwarded_port }}'
  dataFrom:
    - extract:
        key: airvpn
