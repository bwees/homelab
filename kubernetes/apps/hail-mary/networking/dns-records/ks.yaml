---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns-records
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/networking/dns-records/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: external-dns
      namespace: networking
