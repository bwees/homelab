---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bind9-tsig
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bind9-tsig
    template:
      engineVersion: v2
      data:
        external-dns.key: |
          key "external-dns" {
              algorithm hmac-sha256;
              secret "{{ .password }}";
          };
  dataFrom:
    - extract:
        key: bind9-tsig
