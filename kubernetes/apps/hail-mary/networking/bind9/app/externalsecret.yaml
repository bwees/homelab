---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bind9-tsig
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bind9-tsig
    template:
      engineVersion: v2
      data:
        external-dns.key: |
          key "external-dns" {
              algorithm hmac-sha256;
              secret "{{ .TSIG_SECRET }}";
          };
  dataFrom:
    - find:
        path: /bind9
