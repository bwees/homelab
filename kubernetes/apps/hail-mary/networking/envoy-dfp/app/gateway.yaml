---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-dfp
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-dfp
    namespace: networking

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-dfp
  namespace: networking
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        # opwan routes the public address to whichever peer handshook last, so a
        # second replica holding the same key would steal the tunnel back and forth.
        replicas: 1
        pod:
          # The default is five minutes on a dead node before rescheduling, which
          # is five minutes of every public hostname being down.
          tolerations:
            - key: node.kubernetes.io/not-ready
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 30
            - key: node.kubernetes.io/unreachable
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 30
        # The dynamic resolver has to see the split-horizon view of bwees.io, so
        # bind9 answers for these pods instead of CoreDNS. It is deliberately the
        # only nameserver: resolv.conf falls through on timeout, and a fallback
        # would answer from the public wildcard - which points back at this proxy,
        # turning an outage into an SNI loop. bind9 relays cluster.local (needed
        # for xDS) and tail72746.ts.net on to CoreDNS itself.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  dnsPolicy: None
                  dnsConfig:
                    nameservers:
                      - 10.43.148.53
                    searches:
                      - networking.svc.cluster.local
                      - svc.cluster.local
                      - cluster.local
                    # ndots:5 would walk every search domain before trying the
                    # hostname the client actually asked for.
                    options:
                      - name: ndots
                        value: '1'
                  # The public address terminates in this pod's network namespace,
                  # so Envoy sees real client addresses and needs no extra hop.
                  containers:
                    - name: opwan
                      image: lscr.io/linuxserver/wireguard:1.0.20260223
                      command:
                        - sh
                        - -c
                        - |
                          wg-quick down opwan 2>/dev/null
                          wg-quick up opwan || exit 1
                          trap 'wg-quick down opwan; exit 0' TERM
                          sleep infinity & wait
                      securityContext:
                        runAsUser: 0
                        runAsNonRoot: false
                        capabilities:
                          add: ['NET_ADMIN']
                      resources:
                        requests:
                          cpu: 10m
                          memory: 16Mi
                        limits:
                          memory: 64Mi
                      volumeMounts:
                        - name: opwan
                          mountPath: /etc/wireguard
                          readOnly: true
                  volumes:
                    - name: opwan
                      secret:
                        secretName: opwan-wireguard
                        defaultMode: 0400

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-dfp
  namespace: networking
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  gatewayClassName: envoy-dfp
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.bwees.io'
      allowedRoutes:
        namespaces:
          from: Same
    # Passthrough, so nothing is decrypted here: the origin serves its own
    # bwees-io-tls and the client validates it end to end. The hostname is the SNI
    # match, and the SNI is also what the dynamic resolver forwards to.
    - name: tls
      protocol: TLS
      port: 443
      hostname: '*.bwees.io'
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Passthrough
