---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opwan-wireguard
  namespace: networking
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opwan-wireguard
    template:
      engineVersion: v2
      data:
        # Only traffic from the public address uses the tunnel; everything else
        # in the pod keeps the cluster routes. Envoy listens on 10080/10443, and
        # nothing else in the pod is reachable from the internet.
        opwan.conf: |
          [Interface]
          PrivateKey = {{ .password }}
          Address = 72.244.89.3/32
          # flannel's 1450 minus WireGuard's 60 bytes
          MTU = 1390
          Table = 51820
          PostUp = ip -4 rule add from 72.244.89.3 table 51820 priority 100
          PostUp = iptables -t nat -A PREROUTING -i %i -p tcp --dport 80 -j REDIRECT --to-ports 10080
          PostUp = iptables -t nat -A PREROUTING -i %i -p tcp --dport 443 -j REDIRECT --to-ports 10443
          PostUp = iptables -A INPUT -i %i -m conntrack --ctstate DNAT,RELATED -j ACCEPT
          PostUp = iptables -A INPUT -i %i -j DROP
          PostDown = ip -4 rule del from 72.244.89.3 table 51820 priority 100
          PostDown = iptables -t nat -D PREROUTING -i %i -p tcp --dport 80 -j REDIRECT --to-ports 10080
          PostDown = iptables -t nat -D PREROUTING -i %i -p tcp --dport 443 -j REDIRECT --to-ports 10443
          PostDown = iptables -D INPUT -i %i -m conntrack --ctstate DNAT,RELATED -j ACCEPT
          PostDown = iptables -D INPUT -i %i -j DROP

          [Peer]
          PublicKey = RuO6ata3CRkqMcd8qNpfSxPiBbVIxlqxE+lulpef3AY=
          Endpoint = dfw.wg.opwan.io:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
  dataFrom:
    - extract:
        key: opwan-dfw
