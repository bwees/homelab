---
# Pods attach with a static address from 192.168.30.128/25 (the half of the
# IoT VLAN kept out of the DHCP pool) and a fixed MAC.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  # The LAN route keeps replies to LAN clients on the IoT side; through the pod
  # network they would leave with an IoT source address and be dropped.
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "iot",
      "type": "macvlan",
      "master": "iot0",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "192.168.50.0/24", "gw": "192.168.30.1" }
        ]
      }
    }
