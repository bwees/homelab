apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cah
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cah-secret
    template:
      data:
        DISCORD_TOKEN: '{{ .DISCORD_BOT_TOKEN }}'
        DISCORD_APP_ID: '{{ .DISCORD_APP_ID }}'
  dataFrom:
    - find:
        path: /cah
