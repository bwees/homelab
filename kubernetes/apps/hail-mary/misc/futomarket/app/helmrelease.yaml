apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: futomarket
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: futomarket
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/bwees/futomarket
              tag: v0.1.9
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1024Mi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
              readiness: *probes

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
            appProtocol: kubernetes.io/ws

    route:
      main:
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - futomarket.bwees.io
        rules:
          - backendRefs:
              - identifier: main
                port: 3000

    persistence:
      data:
        existingClaim: futomarket-data
        globalMounts:
          - path: /app/data
