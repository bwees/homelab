apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloc
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/misc/alloc/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: volsync
      namespace: storage
    - name: onepassword
      namespace: secrets
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: alloc
      VOLSYNC_CLAIM: alloc-data
      VOLSYNC_UID: '10001'
      VOLSYNC_GID: '10001'
  targetNamespace: misc
