apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zulip-demo
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/misc/zulip-demo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: onepassword
      namespace: secrets
  targetNamespace: misc
