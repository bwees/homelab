---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zulip-demo-data
  namespace: misc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: miroir
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zulip-demo-postgres
  namespace: misc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: miroir
  resources:
    requests:
      storage: 5Gi
