---
# Key names match the Docker secret names the zulip image reads from /run/secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-demo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zulip-demo-secret
    template:
      data:
        zulip__postgres_password: '{{ .postgres_password }}'
        zulip__memcached_password: '{{ .memcached_password }}'
        zulip__rabbitmq_password: '{{ .rabbitmq_password }}'
        zulip__redis_password: '{{ .redis_password }}'
        zulip__secret_key: '{{ .secret_key }}'
        zulip__email_password: '{{ .email_password }}'
  dataFrom:
    - extract:
        key: zulip-demo
