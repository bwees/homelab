apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readme-stats
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: readme-stats-secret
    template:
      data:
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
  dataFrom:
    - find:
        path: /readme-stats
