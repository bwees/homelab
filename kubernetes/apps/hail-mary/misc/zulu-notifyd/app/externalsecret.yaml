apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulu-notifyd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zulu-notifyd-secret
    template:
      data:
        ZULU_KEY_ENCRYPTION_KEY: '{{ .key_encryption_key }}'
        ZULU_APNS_KEY_ID: '{{ .apns_key_id }}'
  dataFrom:
    - extract:
        key: zulu-notifyd

---
# A separate secret so the key file is mounted rather than leaking into envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulu-notifyd-apns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zulu-notifyd-apns
    template:
      engineVersion: v2
      data:
        apns.p8: '{{ .apns_p8_base64 | b64dec }}'
  dataFrom:
    - extract:
        key: zulu-notifyd
