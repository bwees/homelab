apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dropla
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dropla
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/bwees/dropla
              tag: v0.1.0
            env:
              PUBLIC_BASE_URL: https://dropla.bwees.io
              ABANDONED_UPLOAD_AFTER: 12h
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
            appProtocol: kubernetes.io/ws

    route:
      main:
        parentRefs:
          - name: envoy-internal
            namespace: networking
          - name: envoy-external
            namespace: networking
        hostnames:
          - dropla.bwees.lab
          - dropla.bwees.io
        rules:
          - backendRefs:
              - identifier: main
                port: 3000

    persistence:
      data:
        existingClaim: dropla-storage
        globalMounts:
          - path: /data/uploads
      config:
        existingClaim: dropla-config
        globalMounts:
          - path: /data/db
