apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-mirror
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: gitea-mirror-secret
    template:
      data:
        BETTER_AUTH_SECRET: '{{ .AUTH_SECRET }}'
  dataFrom:
    - find:
        path: /gitea-mirror
