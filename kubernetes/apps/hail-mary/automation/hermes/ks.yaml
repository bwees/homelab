apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/automation/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: volsync
      namespace: storage
    - name: onepassword
      namespace: secrets
    - name: browser
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: hermes
      VOLSYNC_CLAIM: hermes-data
      # /opt/data is owned by the image's hermes user; the restic mover has to
      # match it to read the 0600 files (.env, auth.json).
      VOLSYNC_UID: '10000'
      VOLSYNC_GID: '10000'
  targetNamespace: automation
