apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: changedetection
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: '0.60.3'
            env:
              # The IP, not the Service name: Chromium rejects a Host header
              # that is neither an IP nor localhost. Playwright discovers the
              # browser websocket from the /json endpoints behind it.
              PLAYWRIGHT_DRIVER_URL: http://10.43.0.100:9222
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 5000
            appProtocol: kubernetes.io/ws

    route:
      main:
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - changedetection.bwees.dev
        rules:
          - backendRefs:
              - identifier: main
                port: 5000

    persistence:
      datastore:
        existingClaim: changedetection-datastore
        globalMounts:
          - path: /datastore
