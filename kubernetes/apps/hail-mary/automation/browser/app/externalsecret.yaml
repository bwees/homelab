apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: browser-secret
    template:
      data:
        CUSTOM_USER: '{{ .USERNAME }}'
        PASSWORD: '{{ .PASSWORD }}'
  dataFrom:
    - find:
        path: /browser
