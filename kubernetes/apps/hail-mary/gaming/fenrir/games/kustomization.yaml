apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - user.yaml
  - steam.yaml
  - ryujinx.yaml
  - eglantine.yaml
  - minecraft.yaml

configMapGenerator:
  - name: fenrir-launcher
    files:
      - launch.sh

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
