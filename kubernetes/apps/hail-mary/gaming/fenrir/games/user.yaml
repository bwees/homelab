---
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: bwees
spec:
  sidecarPolicies:
    # Privileged gets wolf /dev/dri, /dev/uinput and /dev/uhid from the host.
    wolf:
      securityContext:
        privileged: true
      # Wolf's supervisord must start as root; the operator defaults to ubuntu.
      env:
        - { name: PUID, value: "0" }
        - { name: PGID, value: "0" }
        - { name: UNAME, value: root }
