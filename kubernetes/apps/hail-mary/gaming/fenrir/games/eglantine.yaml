---
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: eglantine
spec:
  id: 3
  title: Eglantine
  isHDRSupported: false
  appAssetWebP: AA== # placeholder until icons are added
  volumeClaimTemplate:
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: miroir-games
      resources:
        requests:
          storage: 20Gi
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/bwees/eglantine-fedora:daily-20261118@sha256:657dbc117c2fbff3f639cfc1d1fd7cf2173f7b0f62efef7cac21f39d676f42ad
          command: [/bin/bash, /opt/fenrir/launch.sh]
          securityContext:
            # Wolf hotplugs controllers under /dev/input at runtime.
            privileged: true
          env:
            - { name: LIBVA_DRIVER_NAME, value: radeonsi }
            - { name: RUN_GAMESCOPE, value: "true" } # sway crashes on Wolf's duplicate wl_drm
            - { name: GOW_REQUIRED_DEVICES, value: /dev/input/* /dev/dri/* }
            - { name: EDEN_NX2_FRAMES_AHEAD, value: "1" }
          volumeMounts:
            - { name: launcher, mountPath: /opt/fenrir }
            # Host /dev/input, so controllers Wolf creates mid-session appear here.
            - { name: input-devices, mountPath: /dev/input }
            - { name: roms, mountPath: /games, readOnly: true }
      volumes:
        - name: input-devices
          hostPath:
            path: /dev/input
            type: Directory
        - name: launcher
          configMap:
            name: fenrir-launcher
        - name: roms
          nfs:
            server: nas.bwees.dev
            path: /games/switch2
            readOnly: true
