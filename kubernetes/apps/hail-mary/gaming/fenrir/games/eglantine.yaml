---
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: eglantine
spec:
  id: 3
  title: Eglantine
  isHDRSupported: false
  appAssetWebP: AA== # placeholder until icons are added
  volumeClaimTemplate:
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: miroir
      resources:
        requests:
          storage: 20Gi
  template:
    spec:
      containers:
        - name: app
          # v0.1.0-rc3
          image: ghcr.io/bwees/eglantine-fedora:0e688c0b9493cf58f5b7ca903ecf0f5f10eecd74@sha256:76f55ae347eda7c477578cdf22cfc829b21c19ab5efaab8596c08a84781f7c5e
          command: [/bin/bash, /opt/fenrir/launch.sh]
          securityContext:
            # Wolf hotplugs controllers under /dev/input at runtime.
            privileged: true
          env:
            - { name: LIBVA_DRIVER_NAME, value: radeonsi }
            - { name: RUN_GAMESCOPE, value: "true" } # sway crashes on Wolf's duplicate wl_drm
            - { name: GOW_REQUIRED_DEVICES, value: /dev/input/* /dev/dri/* }
            - { name: EDEN_NX2_FRAMES_AHEAD, value: "1" }
          volumeMounts:
            - { name: launcher, mountPath: /opt/fenrir }
            - { name: roms, mountPath: /games, readOnly: true }
      volumes:
        - name: launcher
          configMap:
            name: fenrir-launcher
        - name: roms
          nfs:
            server: nas.bwees.dev
            path: /games/switch2
            readOnly: true
