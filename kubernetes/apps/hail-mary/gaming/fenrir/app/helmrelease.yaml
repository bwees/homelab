---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fenrir
  annotations:
    # No `main` controller, so the injected probes would render an imageless one.
    lab.bwees/probe-defaults: disabled
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: fenrir
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    gameImages:
      wolf:
        repository: ghcr.io/games-on-whales/wolf
        tag: stable@sha256:47ce7a0b67ee6645d2c6fefd8fdda7fee49a00e327c39597a04e84a0cd052910
      pulseaudio:
        repository: ghcr.io/games-on-whales/pulseaudio
        tag: edge@sha256:67055b6dec5e1d17d10835762a900d41b71e6ed949593e07a2a546ec03f76f29
      init:
        repository: ghcr.io/games-on-whales/base
        tag: edge@sha256:158dc1c3aee186deebfa2b6ef2431cd58c10983f21a7182bb40265e9e9572732

    gamePods:
      nodeSelector:
        kubernetes.io/hostname: xenonite

    controllers:
      moonlight_proxy:
        pod:
          # Local traffic policy only reaches pods on the node owning the IP.
          nodeSelector:
            kubernetes.io/hostname: xenonite

    streamService:
      type: ClusterIP
      externalIPs:
        - 192.168.50.106 # xenonite LAN
        - 100.118.190.95 # xenonite tailnet
      externalTrafficPolicy: Local
