---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fenrir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: fenrir
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    gamePods:
      nodeSelector:
        kubernetes.io/hostname: xenonite

    controllers:
      moonlight_proxy:
        pod:
          # Local traffic policy only reaches pods on the node owning the IP.
          nodeSelector:
            kubernetes.io/hostname: xenonite

    streamService:
      type: ClusterIP
      externalIPs:
        - 192.168.50.106 # xenonite
      externalTrafficPolicy: Local
