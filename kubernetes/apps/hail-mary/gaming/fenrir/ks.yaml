---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fenrir
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/gaming/fenrir/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cert-manager
      namespace: networking
  targetNamespace: gaming
---
# Apps and Users need the CRDs installed by the chart.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fenrir-games
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/gaming/fenrir/games
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: fenrir
  targetNamespace: gaming
