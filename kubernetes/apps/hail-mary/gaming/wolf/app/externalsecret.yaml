apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wolf-tailscale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wolf-tailscale
    template:
      data:
        TS_AUTHKEY: '{{ .client_secret }}?ephemeral=false&preauthorized=true'
  dataFrom:
    - extract:
        key: tailscale-operator
