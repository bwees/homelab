---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wolf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: wolf
  values:
    controllers:
      main:
        annotations:
          configmap.reloader.stakater.com/reload: wolf-config
        strategy: Recreate
        initContainers:
          # Merge the in-repo config with the live config, preserving paired_clients.
          merge-config:
            image:
              repository: ghcr.io/tomwright/dasel
              tag: 3.11.2-alpine
            command:
              - sh
              - -c
              - |
                set -u
                SRC=/cfg-src/config.toml
                LIVE=/etc/wolf/cfg/config.toml
                mkdir -p /etc/wolf/cfg
                if [ ! -f "$LIVE" ]; then
                  cp "$SRC" "$LIVE"
                  echo "wolf: seeded config from repo"
                elif dasel query -i toml -o toml --var live="toml:file:$LIVE" 'merge($this, {paired_clients: $live.paired_clients})' < "$SRC" > "$LIVE.new" 2>/dev/null; then
                  mv "$LIVE.new" "$LIVE"
                  echo "wolf: applied repo config, preserved paired_clients"
                else
                  rm -f "$LIVE.new"
                  echo "wolf: merge failed, kept existing live config"
                fi

        containers:
          main:
            image:
              repository: ghcr.io/games-on-whales/wolf
              tag: stable@sha256:47ce7a0b67ee6645d2c6fefd8fdda7fee49a00e327c39597a04e84a0cd052910
            env:
              HOST_APPS_STATE_FOLDER: /etc/wolf
              XDG_RUNTIME_DIR: /run/user/wolf
              WOLF_DOCKER_SOCKET: /var/run/docker/docker.sock
            securityContext:
              privileged: true

          # Wolf matches streams to sessions by client IP, so clients must
          # reach it directly instead of through a NATing proxy.
          tailscale:
            image:
              repository: tailscale/tailscale
              tag: 'v1.104.7'
            env:
              TZ: America/Chicago
              TS_USERSPACE: 'false'
              TS_HOSTNAME: wolf
              TS_EXTRA_ARGS: '--advertise-tags=tag:hail-mary,tag:kube-service'
              TS_STATE_DIR: /var/lib/tailscale
              TS_KUBE_SECRET: ''
              TS_ACCEPT_DNS: 'false'
            envFrom:
              - secretRef:
                  name: wolf-tailscale
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              capabilities:
                add: ['NET_ADMIN', 'NET_RAW']
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: xenonite

    service:
      main:
        controller: main
        ports:
          https:
            port: 47989
            protocol: TCP
          http:
            port: 47984
            protocol: TCP
          rtsp:
            port: 48010
            protocol: TCP
          control:
            port: 47999
            protocol: UDP
          video:
            port: 48100
            protocol: UDP
          audio:
            port: 48200
            protocol: UDP

    persistence:
      wolf-config:
        type: configMap
        name: wolf-config
        advancedMounts:
          main:
            merge-config:
              - path: /cfg-src/config.toml
                subPath: config.toml
                readOnly: true

      wolf-state:
        type: hostPath
        hostPath: /etc/wolf
        hostPathType: DirectoryOrCreate
        advancedMounts:
          main:
            merge-config:
              - path: /etc/wolf
            main:
              - path: /etc/wolf

      wolf-run:
        type: hostPath
        hostPath: /run/user/wolf
        hostPathType: DirectoryOrCreate
        advancedMounts:
          main:
            main:
              - path: /run/user/wolf

      # Mount socket directory so docker.socket does not become
      # unbound when docker restarts.
      dockersock:
        type: hostPath
        hostPath: /var/run/docker
        hostPathType: Directory
        advancedMounts:
          main:
            main:
              - path: /var/run/docker

      tailscale-state:
        type: hostPath
        hostPath: /etc/wolf/tailscale
        hostPathType: DirectoryOrCreate
        advancedMounts:
          main:
            tailscale:
              - path: /var/lib/tailscale

      dev-net-tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          main:
            tailscale:
              - path: /dev/net/tun

      dev:
        type: hostPath
        hostPath: /dev
        hostPathType: Directory
        advancedMounts:
          main:
            main:
              - path: /dev

      udev:
        type: hostPath
        hostPath: /run/udev
        hostPathType: Directory
        advancedMounts:
          main:
            main:
              - path: /run/udev
