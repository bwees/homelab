---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: windows
spec:
  interval: 1h
  path: ./kubernetes/apps/hail-mary/virtualization/windows/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: onepassword
      namespace: secrets
    - name: tailscale-operator
      namespace: networking
  targetNamespace: virtualization
