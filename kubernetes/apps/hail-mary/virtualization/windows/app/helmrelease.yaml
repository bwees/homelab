---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windows
spec:
  chartRef:
    kind: OCIRepository
    name: windows
  interval: 1h
  values:
    controllers:
      main:
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/hostname: xenonite
          # Windows needs time to shut down cleanly on ACPI power-off
          terminationGracePeriodSeconds: 120
        containers:
          main:
            image:
              repository: dockurr/windows
              tag: '6.06'
            env:
              VERSION: '11'
              CPU_CORES: '4'
              RAM_SIZE: 8G
              DISK_SIZE: 64G
            envFrom:
              - secretRef:
                  name: windows-secret
            securityContext:
              privileged: true
            probes:
              # Restarting the pod mid-install corrupts the VM, so never kill it on a probe.
              liveness:
                enabled: false
              startup:
                enabled: false
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8006
                  periodSeconds: 10
            resources:
              requests:
                cpu: '4'
                memory: 9Gi
              limits:
                memory: 10Gi

    service:
      main:
        controller: main
        annotations:
          tailscale.com/expose: 'true'
          tailscale.com/hostname: windows
        ports:
          http:
            port: 8006
          rdp-tcp:
            port: 3389
            protocol: TCP
          rdp-udp:
            port: 3389
            protocol: UDP

    persistence:
      storage:
        existingClaim: windows-storage
        globalMounts:
          - path: /storage
