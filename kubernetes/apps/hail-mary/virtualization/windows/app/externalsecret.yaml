apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windows
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: windows-secret
    template:
      data:
        USERNAME: '{{ .username }}'
        PASSWORD: '{{ .password }}'
  dataFrom:
    - extract:
        key: windows
