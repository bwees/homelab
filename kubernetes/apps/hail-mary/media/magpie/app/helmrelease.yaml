apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: magpie
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: magpie
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/bwees/magpie
              tag: 'v0.8.0'
            env:
              TZ: America/Chicago
              MAGPIE_BASE_URL: https://magpie.bwees.dev
            envFrom:
              - secretRef:
                  name: magpie-secret
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
              readiness: *probes

      agent:
        type: daemonset
        pod:
          nodeSelector:
            gpu.bwees.dev/present: 'true'
        # The kubelet creates the per-node scratch subpath as root.
        initContainers:
          scratch-owner:
            image: &agentImage
              repository: ghcr.io/bwees/magpie-agent
              tag: 'v0.8.0'
            command: ['chown', '1000:1000', '/scratch']
            env:
              MAGPIE_AGENT_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
        containers:
          main:
            image: *agentImage
            env:
              TZ: America/Chicago
              MAGPIE_URL: http://magpie.media.svc.cluster.local:3000
              MAGPIE_AGENT_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            envFrom:
              - secretRef:
                  name: magpie-secret
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 8Gi
                gpu.bwees.dev/render: '1'
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
          - 303

    service:
      main:
        controller: main
        forceRename: magpie
        ports:
          http:
            port: 3000
            appProtocol: kubernetes.io/ws

    route:
      main:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /api/health
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - magpie.bwees.dev
          - magpie.bwees.io
        rules:
          - backendRefs:
              - identifier: main
                port: 3000

    persistence:
      config:
        existingClaim: magpie-config
        advancedMounts:
          main:
            main:
              - path: /data
      media:
        existingClaim: media-library
        advancedMounts:
          main:
            main:
              - path: /media
          agent:
            scratch-owner: &agentScratch
              - path: /scratch
                subPathExpr: magpie-scratch/$(MAGPIE_AGENT_NAME)
            main: *agentScratch
