apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: magpie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: magpie-secret
    template:
      data:
        MAGPIE_AGENT_SECRET: '{{ .AGENT_SECRET }}'
  dataFrom:
    - find:
        path: /magpie
