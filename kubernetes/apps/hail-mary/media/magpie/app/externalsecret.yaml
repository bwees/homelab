apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: magpie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: magpie-secret
    template:
      data:
        MAGPIE_AGENT_SECRET: '{{ .agent_secret }}'
  dataFrom:
    - extract:
        key: magpie
