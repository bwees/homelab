apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: '5.2.3'
            env:
              TZ: America/Chicago
              QBITTORRENT_DOWNLOAD_PATH: /downloads
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # Trackers must not be resolved by CoreDNS, whose upstream is the ISP's
      # resolver reached off-tunnel. 1.1.1.1 sits outside the cluster CIDRs the
      # netbird-egress component keeps on the main table, so these queries take
      # the exit node like the rest of this pod's traffic.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
            appProtocol: kubernetes.io/ws

    route:
      main:
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - bittorrent.bwees.dev
        rules:
          - backendRefs:
              - identifier: main
                port: 8080

    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media-library
        globalMounts:
          - path: /downloads
            subPath: downloads
