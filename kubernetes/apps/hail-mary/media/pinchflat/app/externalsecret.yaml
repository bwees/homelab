apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinchflat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: pinchflat-secret
    template:
      data:
        BASIC_AUTH_USERNAME: '{{ .USERNAME }}'
        BASIC_AUTH_PASSWORD: '{{ .PASSWORD }}'
  dataFrom:
    - find:
        path: /pinchflat
