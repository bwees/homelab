apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: storage

resources:
  - rbac.yaml
  - externalsecret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: volsync-heartbeat
    files:
      - heartbeat.sh
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
