---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-heartbeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volsync-heartbeat
rules:
  - apiGroups: ['volsync.backube']
    resources: ['replicationsources']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volsync-heartbeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volsync-heartbeat
subjects:
  - kind: ServiceAccount
    name: volsync-heartbeat
    namespace: storage
