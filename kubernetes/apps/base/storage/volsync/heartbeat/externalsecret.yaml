apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-heartbeat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: volsync-heartbeat-secret
    template:
      data:
        GATUS_TOKEN: '{{ .VOLSYNC_HEARTBEAT_TOKEN }}'
  dataFrom:
    - find:
        path: /gatus
