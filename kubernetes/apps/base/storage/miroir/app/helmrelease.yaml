---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: miroir
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: ${MIROIR_CONTROLLER_REPLICAS}
    global:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: miroir
                    app.kubernetes.io/component: controller
    autoEvictAfter: 1h
    drbd:
      alExtents: 6007
    agent:
      loopfileBaseDirs:
        - /var/lib/miroir
    gateway:
      enabled: false
