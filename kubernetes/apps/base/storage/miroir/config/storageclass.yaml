---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
provisioner: miroir.home-operations.com
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  miroir.home-operations.com/replicas: ${MIROIR_DATA_REPLICAS}
  csi.storage.k8s.io/fstype: ext4
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-volsync-src
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  miroir.home-operations.com/replicas: '1'
  csi.storage.k8s.io/fstype: ext4
---
# Restic caches rebuild from the repository and should not outlive the
# ReplicationSource that made them. They are replicated only so the cache
# never pins the mover to a node: the source clone can only land on a node
# that holds a leg of the app volume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-volsync-cache
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  miroir.home-operations.com/replicas: ${MIROIR_DATA_REPLICAS}
  csi.storage.k8s.io/fstype: ext4
