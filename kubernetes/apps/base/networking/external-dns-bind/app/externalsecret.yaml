apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-bind
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: external-dns-bind-secret
    template:
      data:
        TSIG_SECRET: '{{ .TSIG_SECRET }}'
  dataFrom:
    - find:
        path: /bind9
