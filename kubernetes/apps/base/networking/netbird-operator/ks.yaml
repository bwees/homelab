---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-operator
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true # wait for the HelmRelease (and its CRDs) to be ready
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/base/networking/netbird-operator/app
  targetNamespace: networking
  dependsOn:
    - name: onepassword
      namespace: secrets
    # the mutating webhook that injects clients is served over cert-manager certs
    - name: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-peers
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  dependsOn:
    - name: netbird-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/base/networking/netbird-operator/peers
  targetNamespace: networking
