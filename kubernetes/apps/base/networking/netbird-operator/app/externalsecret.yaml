apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbird-api
    template:
      data:
        NB_API_KEY: '{{ .credential }}'
  dataFrom:
    - extract:
        key: netbird-operator
