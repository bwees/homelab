---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ingress-client-tuning
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ingress
  http2:
    initialStreamWindowSize: 32Mi
    initialConnectionWindowSize: 64Mi
  http3: {}
  connection:
    bufferLimit: 32Mi

---
# Public hosts reach this gateway through tau-ceti's TCP-only passthrough, so
# advertising HTTP/3 to them makes browsers try UDP, fail, and bounce between
# h2 and h3. A listener-level policy replaces the gateway one rather than
# merging, so the HTTP/2 settings are repeated.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: public-client-tuning
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ingress
      sectionName: https-public
  http2:
    initialStreamWindowSize: 32Mi
    initialConnectionWindowSize: 64Mi
  connection:
    bufferLimit: 32Mi
  headers:
    lateResponseHeaders:
      remove:
        - alt-svc
