---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ingress
  namespace: networking
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      # Reached over NetBird, not through this Service: the netbird-operator
      # injects a client into every envoy pod, so each replica answers on its own
      # peer address and publishes the `${CLUSTER}-ingress` DNS label.
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                metadata:
                  labels:
                    lab.bwees/netbird: ingress
                spec:
                  containers:
                    - name: envoy
                      securityContext:
                        runAsNonRoot: false
                        runAsUser: 0
                        capabilities:
                          add: ['NET_BIND_SERVICE']
