---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ingress
  namespace: networking
  annotations:
    # Every HTTPRoute on this Gateway resolves to the envoy pods' NetBird DNS
    # label rather than to a pinned overlay address, so a replica coming back with
    # a new peer IP never leaves a stale record behind. Clusters whose ingress is
    # also reachable off-mesh override this with an address (see eridani).
    external-dns.alpha.kubernetes.io/target: ${CLUSTER}-ingress.netbird.cloud
spec:
  gatewayClassName: envoy-ingress
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bwees-dev-tls
    # only use bwees.io certs with its domain
    - name: https-public
      protocol: HTTPS
      port: 443
      hostname: '*.bwees.io'
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bwees-io-tls
