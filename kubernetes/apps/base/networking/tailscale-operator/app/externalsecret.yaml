apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: operator-oauth
    template:
      data:
        client_id: '{{ .CLIENT_ID }}'
        client_secret: '{{ .CLIENT_SECRET }}'
  dataFrom:
    - find:
        path: /tailscale-operator
