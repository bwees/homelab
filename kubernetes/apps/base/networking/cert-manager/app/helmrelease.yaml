---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # tau-ceti answers bwees.io from a static internal CoreDNS view, which holds no
    # _acme-challenge records, so the self check must bypass cluster DNS.
    dns01RecursiveNameservers: 1.1.1.1:53,1.0.0.1:53
    dns01RecursiveNameserversOnly: true
    crds:
      enabled: true
    replicaCount: 1
    cainjector:
      replicaCount: 1
    webhook:
      replicaCount: 1
