---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  annotations:
    # Not an app-template chart; its values.schema.json rejects `controllers`.
    lab.bwees/probe-defaults: disabled
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # bwees.io has a split-horizon view (tau-ceti's bind9) that holds no
    # _acme-challenge records, so the self check must not follow cluster DNS.
    dns01RecursiveNameservers: 1.1.1.1:53,1.0.0.1:53
    dns01RecursiveNameserversOnly: true
    crds:
      enabled: true
    replicaCount: 1
    cainjector:
      replicaCount: 1
    webhook:
      replicaCount: 1
