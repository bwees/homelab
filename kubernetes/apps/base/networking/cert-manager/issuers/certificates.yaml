---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bwees-dev-tls
  namespace: networking
spec:
  secretName: bwees-dev-tls
  # *.bwees.dev does not cover the home.bwees.dev label, so both are listed
  dnsNames:
    - 'bwees.dev'
    - '*.bwees.dev'
    - '*.home.bwees.dev'
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bwees-io-tls
  namespace: networking
spec:
  secretName: bwees-io-tls
  dnsNames:
    - '*.bwees.io'
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
