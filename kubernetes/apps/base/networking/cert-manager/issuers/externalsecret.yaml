---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager
  namespace: networking
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cert-manager-secret
    template:
      data:
        api-token: '{{ .CLOUDFLARE_API_TOKEN }}'
  dataFrom:
    - find:
        path: /cert-manager
