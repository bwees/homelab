---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns
  interval: 1h
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare
            key: CF_API_TOKEN
    extraArgs:
      - --gateway-name=envoy-ingress
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - gateway-httproute
      # Only Services carrying an external-dns hostname annotation are picked up.
      - service
    txtOwnerId: ${CLUSTER}
    txtPrefix: k8s.%{record_type}-
    # bwees.io is deliberately absent: its public wildcard is owned by Tofu, and
    # the internal per-host view is written by external-dns-bind instead.
    domainFilters:
      - bwees.dev
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
