apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: external-dns-secret
    template:
      data:
        CF_API_TOKEN: '{{ .CLOUDFLARE_API_TOKEN }}'
  dataFrom:
    - find:
        path: /external-dns
