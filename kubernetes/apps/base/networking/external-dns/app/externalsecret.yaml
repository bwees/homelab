apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: external-dns-pdns
    template:
      data:
        PDNS_API_KEY: '{{ .PDNS_API_KEY }}'
  dataFrom:
    - extract:
        key: powerdns
