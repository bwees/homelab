---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            key: clientId
            namespace: secrets
          clientSecret:
            name: infisical-universal-auth
            key: clientSecret
            namespace: secrets
      secretsScope:
        projectSlug: homelab
        environmentSlug: prod
