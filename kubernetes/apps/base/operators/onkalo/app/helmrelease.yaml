---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onkalo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: onkalo
  values:
    controllers:
      main:
        serviceAccount:
          identifier: main
        containers:
          main:
            image:
              repository: ghcr.io/bwees/onkalo
              tag: '0.1.0'
            args:
              - --leader-elect
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ['ALL']
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10

    defaultPodOptions:
      # app-template defaults this off; without the projected token the manager
      # cannot build an in-cluster config and exits before it can log why.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

    serviceAccount:
      main: {}

    rbac:
      roles:
        main:
          type: ClusterRole
          rules:
            - apiGroups: ['volsync.backube']
              resources: ['replicationsources']
              verbs: ['get', 'list', 'watch']
            - apiGroups: ['']
              resources: ['secrets']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
            - apiGroups: ['']
              resources: ['events']
              verbs: ['create', 'patch']
            - apiGroups: ['coordination.k8s.io']
              resources: ['leases']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
      bindings:
        main:
          type: ClusterRoleBinding
          roleRef:
            identifier: main
          subjects:
            - identifier: main

    service:
      main:
        controller: main
        ports:
          metrics:
            port: 8080
