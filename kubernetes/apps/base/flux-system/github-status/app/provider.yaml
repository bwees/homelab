apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-status
spec:
  type: github
  address: https://github.com/bwees/homelab
  secretRef:
    name: github-status-token
  # Every cluster reconciles the same commit, so the status context has to carry
  # the cluster name or the four of them overwrite each other on GitHub.
  commitStatusExpr: "'${CLUSTER}/' + event.involvedObject.namespace + '/' + event.involvedObject.name"
