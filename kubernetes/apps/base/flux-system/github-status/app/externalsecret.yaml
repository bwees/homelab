apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-status
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: github-status-secret
    template:
      data:
        token: '{{ .GITHUB_TOKEN }}'
  dataFrom:
    - find:
        path: /github-status
