apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-status
spec:
  interval: 1h
  path: ./kubernetes/apps/base/flux-system/github-status/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword
      namespace: secrets
  targetNamespace: flux-system
