apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: github-webhook-secret
    template:
      data:
        token: '{{ .WEBHOOK_TOKEN }}'
  dataFrom:
    - find:
        path: /github-webhook/${CLUSTER}
