apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-webhook
  annotations:
    gatus.home-operations.com/enabled: 'false'
spec:
  parentRefs:
    - name: envoy-ingress
      namespace: networking
  hostnames:
    - fluxhook-${CLUSTER}.bwees.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
