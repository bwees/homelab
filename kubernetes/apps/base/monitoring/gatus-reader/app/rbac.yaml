apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatus-reader
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatus-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatus-reader
subjects:
  - kind: ServiceAccount
    name: gatus-reader
    namespace: monitoring
  # impersonated by the tailscale API server proxy, granted in tofu/modules/tailscale
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: gatus-reader
