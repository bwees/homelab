endpoints:
  - name: tau-ceti
    group: tau-ceti
    url: 'icmp://100.105.77.106'
    interval: 1m
    conditions:
      - '[CONNECTED] == true'
    alerts:
      - type: discord

  - name: dns
    group: tau-ceti
    # confirms external-dns is still publishing into the bwees.dev Cloudflare zone
    url: '1.1.1.1'
    dns:
      query-name: 'nas.bwees.dev'
      query-type: 'A'
    conditions:
      - '[BODY] == 192.168.50.4'
      - '[DNS_RCODE] == NOERROR'
    alerts:
      - type: discord
