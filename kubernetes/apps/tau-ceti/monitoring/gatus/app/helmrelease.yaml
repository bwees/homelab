apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gatus
  values:
    controllers:
      main:
        annotations:
          configmap.reloader.stakater.com/reload: gatus-config,gatus-kubeconfig
        serviceAccount:
          name: gatus-reader
        pod:
          automountServiceAccountToken: true
        containers:
          main:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.37.0
            env:
              GATUS_CONFIG_PATH: /config
            envFrom:
              - secretRef:
                  name: gatus-secret
            securityContext:
              # gatus pings icmp:// endpoints — needs raw sockets
              capabilities:
                add: ['NET_RAW']
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes

          sidecar-tau-ceti:
            image: &sidecarImage
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: 0.6.0
            args:
              - --auto-httproute
              - --gateway-name=envoy-ingress
              - --output=/config/tau-ceti.yaml
            resources: &sidecarResources
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi

          sidecar-hail-mary:
            image: *sidecarImage
            args:
              - --auto-httproute
              - --gateway-name=envoy-ingress
              - --output=/config/hail-mary.yaml
            env:
              # blank so the sidecar skips in-cluster auth and reads KUBECONFIG
              KUBERNETES_SERVICE_HOST: ''
              KUBECONFIG: /kubeconfig/hail-mary
            resources: *sidecarResources

          sidecar-eridani:
            image: *sidecarImage
            args:
              - --auto-httproute
              - --gateway-name=envoy-ingress
              - --output=/config/eridani.yaml
            env:
              KUBERNETES_SERVICE_HOST: ''
              KUBECONFIG: /kubeconfig/eridani
            resources: *sidecarResources

          sidecar-stepien:
            image: *sidecarImage
            args:
              - --auto-httproute
              - --gateway-name=envoy-ingress
              - --output=/config/stepien.yaml
            env:
              KUBERNETES_SERVICE_HOST: ''
              KUBECONFIG: /kubeconfig/stepien
            resources: *sidecarResources

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    route:
      main:
        annotations:
          gatus.home-operations.com/enabled: 'false'
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - status.bwees.dev
        rules:
          - backendRefs:
              - identifier: main
                port: 8080

    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      static-config:
        type: configMap
        name: gatus-config
        advancedMounts:
          main:
            main:
              - path: /config/static
      kubeconfig:
        type: configMap
        name: gatus-kubeconfig
        advancedMounts:
          main:
            sidecar-hail-mary: &kubeconfigMount
              - path: /kubeconfig
                readOnly: true
            sidecar-eridani: *kubeconfigMount
            sidecar-stepien: *kubeconfigMount
      data:
        existingClaim: gatus-data
        advancedMounts:
          main:
            main:
              - path: /data
