---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bind9
spec:
  interval: 1h
  retryInterval: 2m
  # envoy-dfp waits on this, and wait: true with no timeout inherits the interval:
  # one unhealthy object would hold the reconcile - and the whole bwees.io view -
  # for an hour before retrying.
  timeout: 5m
  path: ./kubernetes/apps/tau-ceti/networking/bind9/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: onepassword
      namespace: secrets
    - name: netbird-peers
      namespace: networking
  targetNamespace: networking
