---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bind9
spec:
  interval: 1h
  path: ./kubernetes/apps/tau-ceti/networking/bind9/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: onepassword
      namespace: secrets
    - name: tailscale-operator
      namespace: networking
  targetNamespace: networking
