---
# Public counterpart to the bwees-ca wildcard-tls, served only by envoy-dfp.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bwees-io-tls
  namespace: networking
spec:
  secretName: bwees-io-tls
  dnsNames:
    - '*.bwees.io'
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
