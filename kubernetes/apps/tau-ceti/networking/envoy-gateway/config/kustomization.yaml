apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/networking/envoy-gateway/config
  - certificate.yaml

patches:
  - target:
      kind: Gateway
      name: envoy-ingress
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: https-maroonrides
          protocol: HTTPS
          port: 443
          hostname: '*.maroonrides.app'
          allowedRoutes:
            namespaces:
              from: All
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: maroonrides-app-tls
  - target:
      kind: Gateway
      name: envoy-ingress
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: envoy-ingress
        annotations:
          external-dns.kubernetes.io/target: 100.83.16.72 # tau-ceti-ingress.tail72746.ts.net
