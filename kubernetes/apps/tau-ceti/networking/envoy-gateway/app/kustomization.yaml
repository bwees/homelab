apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/networking/envoy-gateway/app

# Only tau-ceti runs the release candidate, for the SNI dynamic forward proxy
# (TLSRoute -> DynamicResolver) that landed in 1.9.0-rc.1. Renovate keeps bumping
# the stable tag in the base for every other cluster; delete this overlay once
# 1.9.0 is GA so tau-ceti rejoins it.
patches:
  - target:
      group: source.toolkit.fluxcd.io
      kind: OCIRepository
      name: envoy-gateway
    patch: |-
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: envoy-gateway
      spec:
        ref:
          tag: '1.9.0-rc.1'
