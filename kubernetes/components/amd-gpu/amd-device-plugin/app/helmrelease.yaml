---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-device-plugin
spec:
  interval: 1h
  chart:
    spec:
      # renovate: datasource=helm depName=amd-gpu registryUrl=https://rocm.github.io/k8s-device-plugin/
      chart: amd-gpu
      version: 0.22.0
      sourceRef:
        kind: HelmRepository
        name: rocm
  values:
    nfd:
      enabled: false
    labeller:
      enabled: false

    node_selector_enabled: true

    dp:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
