---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-restic-b2
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ${APP}-restic-b2
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # restic over the B2 S3-compatible endpoint; per-app repo subpath
        RESTIC_REPOSITORY: '{{ .REPOSITORY }}/${CLUSTER}/${APP}'
        RESTIC_PASSWORD: '{{ .RESTIC_PASSWORD }}'
        AWS_ACCESS_KEY_ID: '{{ .ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .SECRET_ACCESS_KEY }}'
  dataFrom:
    - find:
        path: /volsync/b2

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-restic-nas
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ${APP}-restic-nas
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: 'rest:https://{{ .USERNAME }}:{{ .PASSWORD }}@restic.bwees.dev/${CLUSTER}/${APP}'
        RESTIC_PASSWORD: '{{ .RESTIC_PASSWORD }}'
  dataFrom:
    - find:
        path: /volsync/nas
