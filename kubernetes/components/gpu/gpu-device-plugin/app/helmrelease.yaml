---
# Each GPU is shared by up to 16 pods.
# render: Vulkan and VA-API on any vendor.
# rocm: also hands out /dev/kfd, so it only exists on AMD nodes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-device-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gpu-device-plugin
  values:
    controllers:
      main:
        type: daemonset
        pod:
          priorityClassName: system-node-critical
          nodeSelector:
            gpu.bwees.dev/present: 'true'
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
        containers:
          main:
            image:
              repository: docker.io/squat/generic-device-plugin
              tag: '0.2.0'
            args:
              - --domain=gpu.bwees.dev
              - --device={"name":"render","groups":[{"count":16,"paths":[{"path":"/dev/dri/renderD*"}]}]}
              - --device={"name":"rocm","groups":[{"count":16,"paths":[{"path":"/dev/kfd"},{"path":"/dev/dri/renderD*"}]}]}
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

    persistence:
      device-plugins:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
        globalMounts:
          - path: /var/lib/kubelet/device-plugins
      dev:
        type: hostPath
        hostPath: /dev
        globalMounts:
          - path: /dev
