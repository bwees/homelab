---
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: gpu
spec:
  rules:
    - name: gpu
      labels:
        gpu.bwees.dev/present: 'true'
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class:
              op: In
              value: ['0300', '0380']
