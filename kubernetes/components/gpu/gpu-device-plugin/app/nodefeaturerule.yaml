---
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: gpu
spec:
  rules:
    - name: gpu
      labels:
        gpu.bwees.dev/present: 'true'
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class: &displayClasses
              op: In
              value: ['0300', '0380']

    - name: gpu-quicksync
      labels:
        gpu.bwees.dev/quicksync: 'true'
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class: *displayClasses
            vendor:
              op: In
              value: ['8086']

    - name: gpu-rocm
      labels:
        gpu.bwees.dev/rocm: 'true'
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class: *displayClasses
            vendor:
              op: In
              value: ['1002']
