apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ks.yaml
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: apps|apps-base
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        patches:
          - target:
              group: kustomize.toolkit.fluxcd.io
              kind: Kustomization
            patch: |-
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: _
              spec:
                patches:
                  - patch: |-
                      apiVersion: helm.toolkit.fluxcd.io/v2
                      kind: HelmRelease
                      metadata:
                        name: _
                      spec:
                        install:
                          crds: CreateReplace
                          remediation:
                            retries: -1
                        upgrade:
                          crds: CreateReplace
                          cleanupOnFail: true
                          remediation:
                            retries: 3
                            remediateLastFailure: true
                        rollback:
                          cleanupOnFail: true
                    target:
                      group: helm.toolkit.fluxcd.io
                      kind: HelmRelease

                  - patch: |-
                      apiVersion: helm.toolkit.fluxcd.io/v2
                      kind: HelmRelease
                      metadata:
                        name: _
                      spec:
                        values:
                          controllers:
                            main:
                              containers:
                                main:
                                  probes:
                                    liveness:
                                      spec:
                                        initialDelaySeconds: 60
                                        timeoutSeconds: 5
                                    readiness:
                                      spec:
                                        timeoutSeconds: 5
                    target:
                      group: helm.toolkit.fluxcd.io
                      kind: HelmRelease

                  - patch: |-
                      apiVersion: source.toolkit.fluxcd.io/v1
                      kind: OCIRepository
                      metadata:
                        name: _
                      spec:
                        layerSelector:
                          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
                          operation: copy
                    target:
                      group: source.toolkit.fluxcd.io
                      kind: OCIRepository
